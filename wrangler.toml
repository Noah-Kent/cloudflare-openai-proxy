name = "cloudflare-openai-proxy"
main = "src/worker.js"
compatibility_date = "2026-11-04"
compatibility_flags = ["enable_request_signal"]
workers_dev = false
preview_urls = false

# After approval, add a Cloudflare-managed custom domain at the TOP LEVEL:
# routes = [{ pattern = "api.example.com", custom_domain = true }]
# PROXY_TOKEN is a Worker Secret; never put an OpenAI API key here.

[observability]
enabled = false
